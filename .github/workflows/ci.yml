name: CI

# Advisory checks on PRs and non-main pushes. Never a deploy gate.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every ES module
        run: |
          set -e
          for f in $(git ls-files '*.js' | grep -v vendor/); do
            node --input-type=module --check < "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done
          for f in $(git ls-files 'scripts/*.mjs'); do
            node --check "$f"
          done
      - name: The steward's run record parses its fixtures
        run: node .github/steward/run-record.mjs --self-test

      # The janitor is the no-manual-merges guarantee, so its two failure paths
      # are gated here rather than discovered on the fleet two hours later.
      # test-janitor-sweep.sh EXTRACTS the sweep body from steward-janitor.yml,
      # so editing the workflow is what this check is watching for.
      - name: The steward's GitHub calls survive their failure paths
        run: bash .github/steward/test-gh-rest.sh

      # Salvage is the fleet's last line against a cancelled run taking its work
      # with it, and pushing the branch turned out to be only half of that: custom's
      # T-1155 was written in full, pushed, and cancelled before its PR — so the work
      # sat on the remote where no instrument could see it, and another run rebuilt
      # it. The draft PR it now opens is gated here, against a real git remote.
      - name: Salvage leaves nothing on the remote that nobody can see
        run: bash .github/steward/test-salvage.sh

      - name: The janitor gates the merge, and names a conflict out loud
        run: |
          bash .github/steward/janitor-mergeability.sh --self-test
          bash .github/steward/test-janitor-sweep.sh

      # The other half of the janitor working: being dispatched once rather than
      # once per tick. `isDueAt` is hour-granular and the focus cron is `*/10`,
      # so without the busy check a due job is dispatched six times an hour into
      # a workflow whose concurrency group holds one — and on 2026-09-14 three
      # consecutive janitor runs were each cancelled as the next arrived.
      - name: A roster job is dispatched once, not once per tick
        run: bash .github/steward/test-focus-jobs.sh

      - name: Manifest freshness
        run: |
          node scripts/gen-manifest.mjs
          git diff --exit-code lib/MANIFEST.json || {
            echo '::error::lib/MANIFEST.json is stale — run node scripts/gen-manifest.mjs'; exit 1; }
