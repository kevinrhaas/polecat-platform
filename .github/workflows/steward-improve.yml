name: Steward improve
# Annotate each run with the app it targets (shows in the Actions list and in
# Manager's Fleet Ops panel). Mirrors the FOCUS_APP env resolution below.
run-name: "Steward improve — ${{ github.event.inputs.app || 'fleet pick' }}${{ github.event.inputs.slices != '' && github.event.inputs.slices != '1' && format(' [{0}/{1}]', github.event.inputs.slice, github.event.inputs.slices) || '' }}"

# The fleet improvement loop (see .github/steward/improve.md + docs/AUTOMATION.md).
# One unit of work per run, shipped via PR, merged only when smoke is green.
#
# DISPATCH-ONLY. Scheduling lives entirely in .github/steward/focus.json, read
# hourly by steward-focus.yml, which dispatches this workflow with an explicit
# `app=<repo>` per enabled app. There is no schedule here and no
# STEWARD_FOCUS_APP variable anymore — focus.json is the single source of truth
# for which apps run and how often (edit it to start/stop/retarget an app;
# effective on the next hourly tick, no workflow edit).
#
# Two modes, chosen by the `app` dispatch input:
#   • Focus mode: `app=<repo>` → deep-dive on that one app (how focus.json runs).
#   • Fleet mode: empty `app` → the steward picks the app that most needs work.
# To PAUSE an app's recurring runs: set its "enabled": false in focus.json.
#
# Requires repo secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`)
#   STEWARD_PAT              (classic PAT, repo scope on kevinrhaas/* — used
#                             for cross-repo clone/push/PR)

on:
  # No schedule — steward-focus.yml (driven by focus.json) dispatches this per
  # enabled app, and it can be run manually from the Actions tab.
  workflow_dispatch:
    inputs:
      app:
        description: 'Focus on one app (repo name, e.g. autoselector.polecat.live). Empty = fleet pick.'
        required: false
        default: ''
      slice:
        description: 'Which slice of the chain this run is (1-based). Set by the chain; leave 1 for a manual run.'
        required: false
        default: '1'
      slices:
        description: 'Total sequential slices in this chain (focus.json slices; capped at 5). 1 = no chaining.'
        required: false
        default: '1'
      model:
        description: 'Claude model for this run (focus.json lane `model`; empty = CLI default).'
        required: false
        default: ''

env:
  # The app to work on comes from the dispatch input (focus.json passes it per
  # enabled app). Empty — a manual dispatch with no app, or the literal
  # 'fleet' — means the suite-wide fleet pick.
  FOCUS_APP: ${{ github.event.inputs.app }}

permissions:
  contents: read
  actions: write   # lets a run chain the next slice via GITHUB_TOKEN dispatch

# Per-app concurrency: focus runs on DIFFERENT apps proceed in parallel
# (separate repos — no contention); runs on the SAME app queue behind each
# other; the scheduled fleet/variable-driven run has its own lane.
concurrency:
  group: steward-improve-${{ github.event.inputs.app || 'fleet' }}
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    # 150, raised from 90 on 2026-08-14, because 90 had started DISCARDING
    # FINISHED WORK rather than protecting anything.
    #
    # Measured on kevinrhaas/custom, the only lane enabled that day. Eight runs
    # completed: five succeeded at 31, 48, 50, 56, 57, 60, 70 and 81 minutes —
    # and three were cancelled at exactly 90. Every cancellation is the ceiling,
    # not a hang: the successes cluster right underneath it, and 81 minutes of
    # genuine work sits four minutes from being thrown away.
    #
    # A cancelled run costs more than its own hour. The scheduler's skip-if-busy
    # rule holds the next tick while a run is in flight, so a run that dies at
    # minute 89 with nothing committed loses the work AND the following slot.
    # Three cancellations cost roughly three hours of lane time in a day.
    #
    # The parcels grew, which is why the old ceiling stopped fitting. A unit of
    # work was "add a block of roofs" when the lanes opened; the queue now holds
    # parcels whose acceptance requires the renderer smoke TWICE at two viewports
    # to prove a measured before-and-after, and that alone is most of an hour.
    #
    # Raising this does not let two runs of one app overlap — `concurrency`
    # above and the scheduler's skip-if-busy both still hold. It only stops the
    # clock killing work that was about to land.
    timeout-minutes: 150
    steps:
      - name: Check secrets
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          P: ${{ secrets.STEWARD_PAT }}
        run: |
          [ -n "$T" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is missing"; exit 1; }
          [ -n "$P" ] || { echo "::error::STEWARD_PAT secret is missing"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate git + gh for all kevinrhaas repos
        env:
          STEWARD_PAT: ${{ secrets.STEWARD_PAT }}
        run: |
          git config --global url."https://x-access-token:${STEWARD_PAT}@github.com/kevinrhaas/".insteadOf "https://github.com/kevinrhaas/"
          git config --global user.name  "polecat-steward"
          git config --global user.email "steward@polecat.live"
          echo "GH_TOKEN=${STEWARD_PAT}" >> "$GITHUB_ENV"

      - name: Resolve playwright version (browser cache key)
        id: pw
        run: echo "version=$(npm view playwright version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit

      - name: Install Claude Code + browsers
        # A HUNG INSTALL USED TO EAT THE WHOLE JOB CAP. On 2026-08-19 runs 939 and
        # 940 (custom) each sat in `playwright install` for the full 150 minutes and
        # were cancelled with `Run steward` never starting — the orphan-process line
        # at the kill names it: `npm exec playwright install --with-deps chromium
        # webkit`. Between them they held the lane from 00:00 to 05:04 CT and shipped
        # nothing, because skip-if-busy hands the next tick to a run that is already
        # dying.
        #
        # Raising `timeout-minutes` is the wrong lever for this: the step is 40-70
        # SECONDS on a warm browser cache, so a step still running at four minutes is
        # stalled, not slow, and no amount of extra ceiling makes a stalled download
        # finish. Cap each command, retry it once — most registry stalls clear on the
        # second attempt — and if it still will not go, fail the job in ~10 minutes
        # and leave the slot to the next hourly fire.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          try() {                      # try <minutes> <command...> — twice, then fail
            local m=$1; shift
            for i in 1 2; do
              if timeout "${m}m" "$@"; then return 0; fi
              echo "::warning::install attempt $i of 2 stalled or failed: $*"
              sleep 15
            done
            echo "::error::install gave up after 2 attempts: $*"
            return 1
          }
          try 4 npm install -g @anthropic-ai/claude-code
          try 4 npm install --no-save playwright
          # webkit too: several app smoke tests (jobtracker) run the iOS engine
          # (~215MB of downloads skipped on a warm browser cache)
          try 4 npx playwright install --with-deps chromium webkit

      # ---- the chicago/4d lane can bake geometry ------------------------------
      #
      # WHY THIS EXISTS. chicago/4d's queue carries tickets flagged `needs_bake`:
      # their work changes geometry, and geometry comes out of a pinned Blender.
      # This runner had none, so every such ticket was skipped, every run, and by
      # 2026-08-19 SIX of them had silted up at the top of the queue — all six
      # requested by the owner himself (walkable bridges, weathered facades, the
      # fort-reach banks, the sloughs, the Green Tree and Sauganash fabric). The
      # queue was working; the runner simply could not do that kind of work.
      #
      # There is no way around it by being clever with the data, either:
      # `validate.py --stale` hard-fails the moment a record stops matching its
      # committed mesh, so "change the record and let the nightly catch up" does
      # not merge. The bake has to happen inside the run that makes the change.
      #
      # WHAT THIS IS. Only a warm cache. `tools/bake.sh` is self-contained — it
      # sources `generators/blender.pin`, fetches the pinned tarball, verifies its
      # sha256 and refuses to run on a mismatch. All this adds is somewhere to keep
      # the ~380 MB tarball between runs, and a writable path to keep it in (the
      # bake workflow uses /opt/blender-dl, which needs root; $HOME does not).
      # `--only <structure-id>` rebakes one building rather than the town.
      #
      # Custom-lane only, and skipped for a fleet pick: the other seven apps are
      # static sites with no geometry, and a cache miss on their lanes would be
      # pure cost.
      - name: Read chicago/4d's Blender pin
        id: blender
        if: github.event.inputs.app == 'custom'
        run: |
          # From dev, where the pipeline keeps it — the pin is the cache key, so a
          # bump misses naturally and re-fetches instead of running a stale binary.
          if pin=$(gh api "repos/kevinrhaas/custom/contents/chicago/4d/generators/blender.pin?ref=dev" \
                     --jq .content 2>/dev/null | base64 -d); then
            version=$(printf '%s\n' "$pin" | sed -n 's/^BLENDER_VERSION=//p' | head -1)
            [ -n "$version" ] && echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
          # No pin, no cache key — the bake still works, it just pays the download.
          echo "${version:-unresolved}"

      - name: Cache Blender (chicago/4d geometry bakes)
        if: github.event.inputs.app == 'custom' && steps.blender.outputs.version != ''
        uses: actions/cache@v4
        with:
          path: ~/blender-dl
          key: blender-${{ steps.blender.outputs.version }}

      - name: Point bake.sh at the cache, and install what it bakes with
        if: github.event.inputs.app == 'custom'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$HOME/blender-dl"
          echo "BLENDER_CACHE=$HOME/blender-dl" >> "$GITHUB_ENV"
          # build.py's dependencies. Blender's own bundled Python does not see
          # these, but the generators and validate.py that run beside it do.
          timeout 4m pip install --quiet jsonschema pyproj \
            || echo "::warning::pip install failed — a bake will report the missing module"

      - name: Run steward
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional per-app admin tokens: unlock each app's client-side
          # invite/admin gate (live AND locally-served copies — same key) so
          # focused runs can drive the real UI. Never echo their values into
          # commits, PRs, or issues.
          MANAGER_ADMIN_TOKEN: ${{ secrets.MANAGER_ADMIN_TOKEN }}
          ANALYTICS_ADMIN_TOKEN: ${{ secrets.ANALYTICS_ADMIN_TOKEN }}
          JOBTRACKER_ADMIN_TOKEN: ${{ secrets.JOBTRACKER_ADMIN_TOKEN }}
          RELAY_ADMIN_TOKEN: ${{ secrets.RELAY_ADMIN_TOKEN }}
          MODELSERVER_ADMIN_TOKEN: ${{ secrets.MODELSERVER_ADMIN_TOKEN }}
          # Supabase Postgres password for the analytics M7 (Supabase Auth + RLS)
          # backend work — lets a focused run provision the schema/RLS and run
          # server-side DB integration tests via psql. SERVER-SIDE ONLY: the
          # browser app connects via PostgREST + anon key, never this password.
          # Scope DB work to a throwaway `steward_test` schema — never CREATE/
          # DROP/ALTER/DELETE against live `public` tables. Never echo its value.
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          # Browser-side Supabase creds for the analytics M3.2/M7 round-trip
          # (PostgREST + RLS): the project URL is public (ships in client code),
          # the publishable/anon key (sb_publishable_… on the new key format) is
          # browser-safe under RLS. Lets a focused run test the real connect →
          # sign-in → RLS path, not just server-side SQL. anon key is a secret
          # for hygiene; never echo it. NOT the sb_secret_… key (server-only).
          SUPABASE_URL: https://lnngiprrrcxtsawamqei.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          # an explicit 'fleet' input (or an empty app) means the suite-wide pick
          [ "$FOCUS_APP" = "fleet" ] && FOCUS_APP=""
          PROMPT="$(cat .github/steward/improve.md)
          ---
          FOCUS_APP: ${FOCUS_APP:-'(none — fleet pick)'}"
          # Per-lane model pin (focus.json `model` via the dispatch input);
          # empty falls back to the fleet default: opus.
          MODEL="${{ github.event.inputs.model }}"
          MODEL="${MODEL:-claude-opus-5}"

          # A HEARTBEAT, SO SILENCE IS ITSELF REPORTED. The stream below prints
          # as the agent works, but a WEDGED agent prints nothing — and "nothing
          # in the log" is precisely the state we could not previously tell
          # apart from "log arrives at the end". This says so out loud every
          # five minutes, and escalates to an annotation once the stream has
          # been quiet for ten, which is far longer than any real tool call.
          ( started=$SECONDS
            while :; do
              sleep 300
              elapsed=$(( (SECONDS - started) / 60 ))
              quiet=$(( $(date +%s) - $(stat -c %Y /tmp/steward-stream.jsonl 2>/dev/null || date +%s) ))
              line="♥ ${elapsed} min elapsed · last agent event ${quiet}s ago"
              if [ "$quiet" -ge 600 ]; then
                echo "::warning::steward has emitted nothing for $((quiet / 60)) minutes at ${elapsed} min elapsed — likely stalled"
              fi
              echo "$line"
            done ) 2>/dev/null &
          HEARTBEAT=$!
          # `2>/dev/null` on the subshell, NOT `disown` on the job. Run #979 still
          # printed a bare "Terminated" into the log after the agent finished:
          # the notice comes from the SUBSHELL reporting the death of its own
          # foreground `sleep`, which the trap below kills first, so disowning
          # the job in the parent's table was aimed at the wrong process. The
          # heartbeat's own output goes to stdout and is unaffected.
          # Kill the `sleep` BEFORE the shell around it. A subshell blocked on a
          # foreground child defers SIGTERM until that child returns, so killing
          # only $HEARTBEAT leaves the step hanging for up to the sleep interval
          # after the agent has already finished.
          trap 'pkill -P "$HEARTBEAT" 2>/dev/null || true; kill "$HEARTBEAT" 2>/dev/null || true' EXIT

          # STREAMED, NOT BUFFERED. `--output-format text` (the old default)
          # emits the entire transcript in one write at process exit, so this
          # step was silent for its whole life and a cancellation destroyed both
          # the work AND the evidence — see .github/steward/stream-log.mjs and
          # issue #139. stream-json emits one JSON event per action; stream-log
          # renders it live, keeps the raw trail on disk, and still leaves the
          # run's closing summary in /tmp/steward-out.txt for journal.sh.
          claude -p "$PROMPT" \
            ${MODEL:+--model "$MODEL"} \
            --dangerously-skip-permissions \
            --max-turns 200 \
            --output-format stream-json --verbose \
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep" \
            | node .github/steward/stream-log.mjs /tmp/steward-out.txt /tmp/steward-stream.jsonl

      # RESCUE WHAT THE RUN DID NOT GET TO PUSH. The runner is destroyed with
      # the job, so a run cancelled at the cap used to lose every commit it had
      # not already pushed — and #977 lost 149 minutes that way with nothing to
      # resume from. This runs FIRST among the always() steps, before the
      # journal's API calls, because a cancelled job's grace period is short and
      # the work is worth more than its write-up. On a successful run it is a
      # no-op that costs a few seconds and prints the trees for the record.
      - name: Salvage unpushed work
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: bash .github/steward/salvage.sh "${{ github.run_id }}" "${{ job.status }}"

      # The machine-readable trail: one JSON event per action the agent took,
      # written as it went. This is the artefact to download when a run needs
      # explaining after the fact — the rendered log above is a summary of it.
      - name: Keep the agent's event stream
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: steward-stream-${{ github.run_id }}
          path: |
            /tmp/steward-stream.jsonl
            /tmp/steward-out.txt
          if-no-files-found: ignore
          retention-days: 14

      # The run's own account of what it did (the prompt ends by printing a
      # summary) goes to the Steward journal issue — Manager's Fleet Ops shows
      # it in the run's in-panel review.
      # continue-on-error: journaling posts to a GitHub issue over GraphQL, which
      # shares the PAT's rate budget with PR ops and Manager's live Fleet Ops
      # polling. A rate-limited journal must NOT flip a run whose actual work
      # already shipped (PR merged) to "failure" — the work is the result, the
      # journal is just its write-up.
      - name: Journal the run
        if: always()
        continue-on-error: true
        run: bash .github/steward/journal.sh "${{ github.run_id }}" "Steward improve — ${{ github.event.inputs.app || 'fleet pick' }}" "${{ job.status }}" /tmp/steward-out.txt

      # Chain the next slice. focus.json's `slices: N` runs as N SEQUENTIAL units,
      # each dispatched by the previous run on completion — NOT all fired up front
      # (that overflows the per-app concurrency queue, which holds only one running
      # + one pending, so GitHub cancels the surplus). Hard-capped at 5 so a bug
      # can never loop forever. The per-app concurrency group serializes the
      # handoff, and steward-focus skips an app that still has a run in flight, so
      # a chain that outruns the hour just continues without a competing chain.
      #
      # Gated on job.status == 'success': the "Run steward" step has no
      # continue-on-error, so it alone determines job.status here. A run that
      # errors out (e.g. "Reached max turns") must NOT hand off to the next
      # slice — that unconditional handoff is what let a week of failing
      # analytics runs burn through the fleet's shared GraphQL quota (see
      # tech-sweep issue #106). A held-but-not-crashed run (exit 0, PR left
      # open with `hold`) still chains, same as before.
      - name: Chain next slice
        if: always() && job.status == 'success'
        continue-on-error: true   # a rate-limited handoff shouldn't fail a shipped run; the next tick's skip-if-busy sees no in-flight run and restarts the chain
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ github.event.inputs.app }}
          SLICE: ${{ github.event.inputs.slice || '1' }}
          SLICES: ${{ github.event.inputs.slices || '1' }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          SLICE=${SLICE:-1}; SLICES=${SLICES:-1}
          if [ -n "$APP" ] && [ "$APP" != "fleet" ] \
             && [ "$SLICE" -lt "$SLICES" ] && [ "$SLICE" -lt 5 ]; then
            NEXT=$((SLICE + 1))
            echo "→ chaining slice ${NEXT}/${SLICES} for ${APP}"
            gh workflow run steward-improve.yml -R kevinrhaas/polecat-platform \
              -f app="${APP}" -f slice="${NEXT}" -f slices="${SLICES}" -f model="${MODEL}"
          else
            echo "no chain (app='${APP}' slice=${SLICE} slices=${SLICES})"
          fi
