name: Steward focus scheduler

# Multi-app focus runs, driven by .github/steward/focus.json (the roster).
# Every 10 MINUTES this cheap, Claude-free job reads the roster and dispatches a
# "Steward improve" run per enabled app that is due AND idle. everyHours still
# gates coarse cadence (everyHours:1 = eligible every tick, so it runs ~as fast
# as its runs finish; 2 = even UTC hours…); the skip-if-busy check below is what
# turns "eligible every tick" into "one unit at a time, next one within ~10 min
# of the last finishing."
# An app's `slices` (1..5, default 1) runs as that many PARALLEL units: this job
# dispatches ALL N runs in one tick (slice=1..N, slices=N), and they work at the
# same time — N agent lanes on that app at once, each its own unit of work with
# its own PR + smoke gate. Each run is told "SLICE: k of N" and takes the k-th
# topmost workable item from the app's queue, so siblings starting from an
# identical repo state don't all grab the same one (see improve.md § PARALLEL
# SLICES; chicago/4d additionally locks via `ticket.mjs claim`/`inflight`).
#
# This used to CHAIN instead — one run dispatching the next on completion —
# because all slices shared one concurrency group and a GitHub group holds only
# one running + one pending, so the surplus was cancelled. steward-improve's
# group now carries the slice number (`…-s<k>`), which is what makes the
# simultaneous fan-out safe.
#
# Batch semantics: the skip-if-busy check below means a new batch fires only
# when the lane is due again AND no slice of the previous batch is still in
# flight — the lane tops up as a whole, never mid-batch.
#
# Different apps run in PARALLEL too (separate repos — no contention). Turn apps on/off or change cadence by editing
# focus.json — from the GitHub UI, any Claude session, or (roadmap) the
# Manager console. No workflow edits, takes effect next tick.
#
# Dispatches with the built-in GITHUB_TOKEN (`actions: write` below):
# workflow_dispatch and repository_dispatch are GitHub's documented exceptions
# to the "GITHUB_TOKEN events don't start workflow runs" rule, and a same-repo
# dispatch needs no PAT at all. (The old STEWARD_PAT dispatching 403'd the
# first time the roster actually enabled an app — 2026-07-16.)

on:
  schedule:
    # Every 10 minutes: the tick is the loop's heartbeat. Each tick fires a full
    # BATCH per IDLE enabled lane (skip-if-busy below waits out every slice of
    # the batch before), so a lane starts its next batch within ~10 min of going
    # idle — and a batch that died mid-way restarts on the next tick instead of
    # stalling an hour. Drop to '*/5 * * * *' to run more aggressively. (GitHub may delay a
    # scheduled tick under load, so treat 10 min as the floor, not a guarantee.)
    - cron: '*/10 * * * *'
  workflow_dispatch: {}         # manual tick for testing

permissions:
  contents: read
  actions: write   # lets GITHUB_TOKEN dispatch steward-improve on this repo

concurrency:
  group: steward-focus
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch focus runs per roster
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=0
          # schedule.mjs is the canonical lane evaluator (cadence, offset,
          # window, startAt, until — see its header). `due` prints the apps
          # whose lanes fire this hour.
          # `due` prints each due app ONCE. Dispatch the lane's FULL BATCH: N
          # parallel runs, slice=1..N, all at this tick. Skip an app that still
          # has any steward-improve run in flight — that is the batch gate (a
          # lane tops up as a whole, never mid-batch).
          #
          # The busy check matches the run TITLE exactly, not as a substring:
          # `contains("polecat")` also matched "…— polecat-platform" and every
          # "…— polecat.live" run, so those lanes silently skipped each other.
          # steward-improve's run-name is "Steward improve — <app>" plus an
          # optional " [k/N]" suffix, so anchor on both forms.
          for APP in $(node .github/steward/schedule.mjs due); do
            BUSY=$(gh run list -R kevinrhaas/polecat-platform --workflow steward-improve.yml \
              --limit 60 --json status,displayTitle \
              -q "[.[] | select(.status==\"in_progress\" or .status==\"queued\") | .displayTitle] | map(select(. == \"Steward improve — ${APP}\" or startswith(\"Steward improve — ${APP} [\"))) | length" 2>/dev/null || echo 0)
            if [ "${BUSY:-0}" -gt 0 ]; then
              echo "↷ skipping ${APP} — ${BUSY} run(s) still in flight; the batch finishes first"
              continue
            fi
            N=$(node .github/steward/schedule.mjs slices-of "${APP}")
            M=$(node .github/steward/schedule.mjs model-of "${APP}")
            echo "→ dispatching ${APP} — ${N} parallel slice(s)${M:+, model ${M}}"
            K=1
            while [ "$K" -le "$N" ]; do
              gh workflow run steward-improve.yml -R kevinrhaas/polecat-platform \
                -f app="${APP}" -f slice="${K}" -f slices="${N}" -f model="${M}" \
                && echo "  ✓ slice ${K}/${N}" || echo "::warning::dispatch failed for ${APP} slice ${K}/${N}"
              COUNT=$((COUNT+1))
              K=$((K+1))
              # GitHub's secondary rate limit trips on bursts of writes; space
              # the fan-out out rather than firing 5 dispatches back-to-back.
              sleep 3
            done
          done
          # Platform-level jobs (focus.json `jobs`) ride the same tick and the
          # same lane schema: fleet-improve → suite-wide steward pick;
          # sweep-ux / sweep-tech / janitor → their workflows (their own crons
          # are retired — this roster is the single scheduler).
          for JOB in $(node .github/steward/schedule.mjs due-jobs); do
            case "$JOB" in
              fleet-improve) WF="steward-improve.yml"; ARGS="-f app=fleet" ;;
              sweep-ux)      WF="steward-sweep-ux.yml"; ARGS="" ;;
              sweep-tech)    WF="steward-sweep-tech.yml"; ARGS="" ;;
              janitor)       WF="steward-janitor.yml"; ARGS="" ;;
              *) echo "::warning::unknown roster job '$JOB' — skipping"; continue ;;
            esac
            echo "→ dispatching job ${JOB} (${WF})"
            gh workflow run "$WF" -R kevinrhaas/polecat-platform $ARGS
            COUNT=$((COUNT+1))
          done
          echo "Dispatched ${COUNT} run(s) for UTC hour $(date -u +%-H)."
          [ "$COUNT" -eq 0 ] && echo "(nothing on the roster is due this hour)" || true
