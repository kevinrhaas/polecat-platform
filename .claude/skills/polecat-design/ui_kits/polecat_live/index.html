<body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="PageSections.jsx"></script>
<script type="text/babel">
const { Ticker, AuroraBackdrop, SiteFooter } = window.PolecatDesignSystem_dd3c05;
const STACK=['Pentaho','Snowflake','Databricks','BigQuery','Redshift','Kubernetes','AWS','Azure','GCP','GenAI','Vector search','ETL & ELT','Mondrian','Dimensional modeling','Document AI','Agent-driven development','Open source'];
function Page(){
  useReveal();
  const [p,setP]=React.useState(0);
  React.useEffect(()=>{const f=()=>setP(scrollY/Math.max(1,document.body.scrollHeight-innerHeight));addEventListener('scroll',f,{passive:true});return()=>removeEventListener('scroll',f)},[]);
  return <>
    <AuroraBackdrop/>
    <div aria-hidden="true" style={{position:'fixed',top:0,left:0,height:'2.5px',width:'100%',zIndex:70,background:'linear-gradient(90deg,var(--brand-a),var(--brand-b),var(--blush),#b070f0)',transformOrigin:'0 50%',transform:`scaleX(${p})`,pointerEvents:'none'}}/>
    <Nav/><Hero/><Ticker items={STACK}/>
    <main><Idea/><Launcher/><Method/><Work/><About/><Connect/><FinalCta/></main>
    <SiteFooter variant="root" suiteLinks={[{label:'Apps',href:'#apps'},{label:'How we build',href:'#method'},{label:'What I do',href:'#work'},{label:'GitHub',href:'https://github.com/kevinrhaas'},{label:'Email',href:'mailto:kevin.haas@polecat.live'}]}/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page/>);
</script></body></html>
