<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-brand);padding:18px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style></head><body><script src="../../assets/icons-global.js"></script><div id="f" style="display:flex;gap:22px;flex-wrap:wrap"></div>
<script>const APPS=[['chat','Chat','#8b5cf6'],['briefcase','JobTracker','#1a8fd6'],['chart','Analytics','#d4773b'],['car','AutoSelector','#3e7bfa'],['network','Relay','#21c7a8'],['gamepad','Games','#ff2e97'],['gauge','Manager','#22d3ee'],['terminal','Model Server','#d4773b']];
document.getElementById('f').innerHTML=APPS.map(([g,n,a])=>'<div style="text-align:center;width:74px"><span style="width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:'+a+';background:color-mix(in srgb,'+a+' 10%,transparent);border:3px solid '+a+'">'+PolecatIcons.icon(g,24)+'</span><b style="display:block;font-size:11px;font-weight:700;margin-top:8px">'+n+'</b><code style="font-family:var(--mono);font-size:9.5px;color:var(--text-3)">'+g+'</code></div>').join('');</script></body></html>
