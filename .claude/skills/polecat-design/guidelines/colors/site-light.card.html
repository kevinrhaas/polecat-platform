<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-site);padding:18px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:100px}.sw i{display:block;height:52px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.sw b{display:block;font-size:11.5px;font-weight:700;margin-top:7px}.sw code{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:700;margin:0 0 10px}</style></head><body><div class="row"><div class="sw"><i style="background:#FBF7F1"></i><b>Page</b><code>--bg</code></div><div class="sw"><i style="background:#F3EBDD"></i><b>Band</b><code>--bg-2</code></div><div class="sw"><i style="background:#FFFFFF"></i><b>Surface</b><code>--surface</code></div><div class="sw"><i style="background:#F8F1E5"></i><b>Surface 2</b><code>--surface-2</code></div><div class="sw"><i style="background:#E5D9C5"></i><b>Border</b><code>--border</code></div><div class="sw"><i style="background:#241D2E"></i><b>Text</b><code>--text</code></div><div class="sw"><i style="background:#5E566E"></i><b>Text 2</b><code>--text-2</code></div><div class="sw"><i style="background:#8A8296"></i><b>Text 3</b><code>--text-3</code></div></div></body></html>
