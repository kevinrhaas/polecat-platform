<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-site);padding:18px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:100px}.sw i{display:block;height:52px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.sw b{display:block;font-size:11.5px;font-weight:700;margin-top:7px}.sw code{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:700;margin:0 0 10px}</style></head><body><div class="row"><div class="sw"><i style="background:#0a0a0f"></i><b>Bg</b><code>--bg</code></div><div class="sw"><i style="background:#111118"></i><b>Surface</b><code>--surface</code></div><div class="sw"><i style="background:#18181f"></i><b>Surface 2</b><code>--surface-2</code></div><div class="sw"><i style="background:#222230"></i><b>Surface 3</b><code>--surface-3</code></div><div class="sw"><i style="background:#2a2a3c"></i><b>Border</b><code>--border</code></div><div class="sw"><i style="background:#e8e8f2"></i><b>Text</b><code>--text</code></div><div class="sw"><i style="background:#d4773b"></i><b>Brand</b><code>--brand</code></div><div class="sw"><i style="background:#9333ea"></i><b>Accent</b><code>--accent</code></div></div></body></html>
