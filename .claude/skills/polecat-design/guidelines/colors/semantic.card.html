<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Shared by site and app; tinted with color-mix, never hand-picked" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-site);padding:18px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:100px}.sw i{display:block;height:52px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.sw b{display:block;font-size:11.5px;font-weight:700;margin-top:7px}.sw code{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:700;margin:0 0 10px}</style></head><body><div class="row"><div class="sw"><i style="background:#34d399"></i><b>Success</b><code>--pc-success</code></div><div class="sw"><i style="background:#f87171"></i><b>Danger</b><code>--pc-danger</code></div><div class="sw"><i style="background:#fbbf24"></i><b>Warning</b><code>--pc-warning</code></div><div class="sw"><i style="background:#60a5fa"></i><b>Info</b><code>--pc-info</code></div></div>
<div class="row" style="margin-top:14px"><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:#34d399;background:color-mix(in srgb,#34d399 14%,transparent);border:1px solid color-mix(in srgb,#34d399 32%,transparent)">feature</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:#f87171;background:color-mix(in srgb,#f87171 14%,transparent);border:1px solid color-mix(in srgb,#f87171 32%,transparent)">fix</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:#fbbf24;background:color-mix(in srgb,#fbbf24 14%,transparent);border:1px solid color-mix(in srgb,#fbbf24 32%,transparent)">overdue</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:#60a5fa;background:color-mix(in srgb,#60a5fa 14%,transparent);border:1px solid color-mix(in srgb,#60a5fa 32%,transparent)">polish</span></div></body></html>
