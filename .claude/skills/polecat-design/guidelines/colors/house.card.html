<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-site);padding:18px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:100px}.sw i{display:block;height:52px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.sw b{display:block;font-size:11.5px;font-weight:700;margin-top:7px}.sw code{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:700;margin:0 0 10px}</style></head><body><div class="row"><div class="sw"><i style="background:#9C6B3F"></i><b>Brown</b><code>--pc-brown</code></div><div class="sw"><i style="background:#e08a45"></i><b>Orange</b><code>--pc-orange</code></div><div class="sw"><i style="background:#F4A6A6"></i><b>Blush</b><code>--pc-blush</code></div><div class="sw"><i style="background:#F5E9D6"></i><b>Cream</b><code>--pc-cream</code></div><div class="sw"><i style="background:#2E2A33"></i><b>Plum ink</b><code>--pc-plum</code></div><div class="sw"><i style="background:#b070f0"></i><b>Glow ✻</b><code>--pc-glow</code></div></div></body></html>
