<!-- @dsCard group="Colors" viewport="700x200" name="Per-app accents" subtitle="One rendered accent per app; the mark is round and single-colour" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-brand);padding:18px 20px;-webkit-font-smoothing:antialiased}</style></head><body>
<script src="../../assets/icons-global.js"></script><div id="f" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"></div>
<div style="font-size:11.5px;color:var(--text-3);margin-top:16px;line-height:1.55">lib/catalog.js also carries an <code style="font-family:var(--mono)">accent2</code> per app — reference only. The mark system renders <b style="color:var(--text-2)">one colour, no gradient</b>.</div>
<script>const APPS=[['chat','Chat','#8b5cf6'],['briefcase','JobTracker','#1a8fd6'],['chart','Analytics','#d4773b'],['car','AutoSelector','#3e7bfa'],['network','Relay','#21c7a8'],['gamepad','Games','#ff2e97'],['gauge','Manager','#22d3ee'],['terminal','Model Server','#d4773b']];
document.getElementById('f').innerHTML=APPS.map(([g,n,a])=>'<div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;color:'+a+';background:color-mix(in srgb,'+a+' 10%,transparent);border:2.5px solid '+a+'">'+PolecatIcons.icon(g,20)+'</span><span><b style="display:block;font-size:12px">'+n+'</b><code style="font-family:var(--mono);font-size:10px;color:var(--text-3)">'+a+'</code></span></div>').join('');</script>
</body></html>
