<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-brand);padding:18px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style></head><body><script src="../../assets/icons-global.js"></script><div class="row" id="t" style="gap:20px"></div>
<div style="font-size:11.5px;color:var(--text-3);margin-top:16px;line-height:1.55">Circle · ring weight 7.5% of size · 10% accent wash · stroke glyph in the accent · <b style="color:var(--text-2)">no gradients in the mark system</b>. The solid variant (far right) is for small sizes and busy surfaces.</div>
<script>const A='#d4773b';
function ring(s){const w=Math.max(1.5,Math.round(s*.075));return '<div style="text-align:center"><span style="width:'+s+'px;height:'+s+'px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:'+A+';background:color-mix(in srgb,'+A+' 10%,transparent);border:'+w+'px solid '+A+'">'+PolecatIcons.icon('chart',Math.round(s*.6))+'</span><code style="font-family:var(--mono);font-size:10px;color:var(--text-3);display:block;margin-top:8px">'+s+'</code></div>'}
document.getElementById('t').innerHTML=[24,30,38,44].map(ring).join('')
+'<div style="width:1px;height:44px;background:var(--border)"></div>'
+[24,30,38,44].map(s=>'<div style="text-align:center"><span style="width:'+s+'px;height:'+s+'px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:'+A+'">'+PolecatIcons.icon('chart',Math.round(s*.67))+'</span><code style="font-family:var(--mono);font-size:10px;color:var(--text-3);display:block;margin-top:8px">'+s+' solid</code></div>').join('');</script></body></html>
