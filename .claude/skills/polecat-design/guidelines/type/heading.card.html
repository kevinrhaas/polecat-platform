<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-brand);padding:18px 20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:100px}.sw i{display:block;height:52px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}.sw b{display:block;font-size:11.5px;font-weight:700;margin-top:7px}.sw code{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:700;margin:0 0 10px}</style></head><body><h2 style="margin:0;font-size:clamp(24px,4vw,36px);font-weight:800;letter-spacing:-.8px;line-height:1.15">A factory that never sleeps</h2>
