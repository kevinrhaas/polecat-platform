<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0b0a10;
    position: relative;
  }
  /* the two font src placeholders below are swapped for data URIs by
     gen-og-image.mjs (setContent has no base URL for relative paths) */
  @font-face {
    font-family: 'Hanken Grotesk';
    src: url('FONT_400') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Hanken Grotesk';
    src: url('FONT_800') format('woff2');
    font-weight: 800;
  }
  .glow-a, .glow-b {
    position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35;
  }
  .glow-a { width: 640px; height: 640px; background: #e08a45; top: -220px; left: -160px; }
  .glow-b { width: 560px; height: 560px; background: #b070f0; bottom: -240px; right: -140px; opacity: .22; }
  .card {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 56px;
    width: 100%; height: 100%; padding: 0 88px;
  }
  .mark {
    flex: none; width: 220px; height: 220px;
    /* Brand v2: never knock the mark out to white — on the dark card it sits
       on a cream coin (mark at 85% via padding), staying dark-on-light. */
    box-sizing: border-box; border-radius: 50%; background: #F5E9D6; padding: 16px;
    filter: drop-shadow(0 18px 40px rgba(224,138,69,.28));
  }
  .copy { flex: 1; min-width: 0; }
  .kicker {
    font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    background: linear-gradient(110deg, #9C6B3F, #e08a45 45%, #F4A6A6);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 58px; line-height: 1.12; font-weight: 800; letter-spacing: -1.5px;
    color: #f1edf7; margin-bottom: 22px;
  }
  h1 .grad {
    background: linear-gradient(110deg, #9C6B3F, #e08a45 45%, #F4A6A6);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  p { font-size: 26px; color: #a59fb8; max-width: 720px; }
</style>
</head>
<body>
  <div class="glow-a" aria-hidden="true"></div>
  <div class="glow-b" aria-hidden="true"></div>
  <div class="card">
    <img class="mark" src="MASCOT_SRC" alt="">
    <div class="copy">
      <div class="kicker">Pole&middot;cat</div>
      <h1>Data, analytics &amp; apps<br>&mdash; <span class="grad">built to fit.</span></h1>
      <p>Open-source software for targeted problems, built at agent scale &mdash; plus thirty years of enterprise data &amp; analytics consulting.</p>
    </div>
  </div>
</body>
</html>
